[package]
name = "blind-designer"
version = "0.17.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
# Embeds the Windows application manifest (Common Controls v6) into the
# release executable; see build.rs. Same helper BlindRadio uses.
shipfitter = { version = "*", features = ["windows-resources"] }

[dependencies]
chroma-core = { path = "../chroma-core" }
wxdragon = "*"
quiet-list = "*"
image = { version = "*", default-features = false, features = ["png", "jpeg", "webp"] }
# Blocking HTTP for the feed-snapshot embed: one GET, no runtime.
ureq = "3"
