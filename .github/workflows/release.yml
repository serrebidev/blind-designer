name: Release (cloud)

# Builds the Windows app in Actions and publishes a GitHub release with
# the zipped executable. Dispatch with a version whose `## <version>`
# section is already in CHANGELOG.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.1.0"
        required: true
        type: string

concurrency:
  group: cloud-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        run: cargo test --workspace

  windows:
    name: Windows build and release
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Prepare the release
        id: prep
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($existing) {
            if (($existing | ConvertFrom-Json).isDraft) {
              Write-Host "Resuming ${tag}: tag and unpublished draft already exist."
              "tag=$tag" >> $env:GITHUB_OUTPUT
              exit 0
            }
            throw "release $tag already published; refusing to re-release"
          }
          if (git ls-remote --tags origin $tag) {
            throw "tag $tag exists without a draft release; refusing"
          }
          $notes = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              $inside = ($line.Trim() -eq "## $env:VERSION")
              if (-not $inside -and $notes) { break }
              continue
            }
            if ($inside) { $notes += $line }
          }
          $notesText = ($notes -join "`n").Trim()
          if (-not $notesText) { throw "no ## $env:VERSION section in CHANGELOG.md" }
          Set-Content -Path "$env:RUNNER_TEMP\notes.md" -Value $notesText -Encoding utf8
          $toml = Get-Content crates\blind-designer\Cargo.toml -Raw
          $toml = $toml -replace '(?m)^version = "[^"]+"', "version = `"$env:VERSION`""
          Set-Content -Path crates\blind-designer\Cargo.toml -Value $toml -Encoding utf8 -NoNewline
          cargo metadata --format-version 1 > $null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/blind-designer/Cargo.toml Cargo.lock
          git commit -m "chore: release $env:VERSION"
          git tag $tag
          git push origin main $tag
          gh release create $tag --draft --title "Blind Designer $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build the release executable
        run: cargo build --release -p blind-designer

      - name: Zip and upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\blind-designer.exe dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath BlindDesigner.zip
          gh release upload "${{ steps.prep.outputs.tag }}" BlindDesigner.zip --clobber

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.prep.outputs.tag }}" --draft=false --latest
