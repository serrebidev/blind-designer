[package]
name = "blind-designer"
version = "0.19.0"
edition.workspace = true
license.workspace = true

# Strings in this crate are translatable with patois (gettext): mark
# user-visible literals with patois::t() and regenerate the template
# with the gen_pot example.
[package.metadata.patois]
translatable = true

[build-dependencies]
patois-build = "0.1"
# Embeds the Windows application manifest (Common Controls v6) into the
# release executable; see build.rs. Same helper BlindRadio uses.
shipfitter = { version = "*", features = ["windows-resources"] }

[dependencies]
chroma-core = { path = "../chroma-core" }
# default-features = false for exactly one reason: wxdragon's
# defaults include wx-asserts, which builds wxWidgets with
# its internal consistency checks live — every failed check
# becomes a modal "debugging check" dialog for the end user,
# even in release builds (the class removed in
# Accessible-IPTV-Client-Rust v0.4.19). Release wx builds
# compile those checks out, as wxPython ships. Every other
# default is re-enabled explicitly, so the ONLY build change
# is the asserts.
wxdragon = { version = "*", default-features = false, features = ["wx-printing", "wx-tiff", "wx-jpeg", "wx-tango-icons", "wx-extra-image-formats", "wx-regex", "appindicator"] }
quiet-list = "*"
image = { version = "*", default-features = false, features = ["png", "jpeg", "webp"] }
# Blocking HTTP for the feed-snapshot embed: one GET, no runtime.
ureq = "3"
# Gettext translations (Quin's patois): catalogs compiled from po/
# by patois-build in build.rs and embedded in the binary; the wx
# feature also translates wxWidgets' own stock dialog strings.
patois = { version = "0.3", features = ["wx"] }

[dev-dependencies]
patois-build = "0.1"
