name: Release (cloud)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.21.2
        required: true
        type: string

concurrency:
  group: cloud-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --locked --workspace

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Build the release executable
        env:
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw crates/blind-designer/Cargo.toml
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$' -or $manifest -notmatch "(?m)^version = `"$($env:TAG.Substring(1))`"\r?$") {
            throw "Release tag $env:TAG does not match the package version"
          }
          cargo build --release --locked -p blind-designer
      - name: Archive and verify signature
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath target/release/blind-designer.exe, README.md -DestinationPath BlindDesigner.zip
          cargo run --locked -p xtask --no-default-features -- sign BlindDesigner.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo run --locked -p xtask --no-default-features -- verify BlindDesigner.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BlindDesigner
          path: |
            BlindDesigner.zip
            BlindDesigner.zip.minisig
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish signed package on Forgejo
    needs: [gate, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: BlindDesigner
      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://git.serrebiradio.com/api/v1/repos/elshara/blind-designer"
          auth="Authorization: token $FORGEJO_TOKEN"
          version="${TAG#v}"
          awk -v header="## $version" '$0 == header { inside=1; next } /^## / { if (inside) exit } inside {print}' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
          test -s BlindDesigner.zip
          test -s BlindDesigner.zip.minisig

          releases="$(curl -fsS -H "$auth" "$api/releases?limit=50")"
          release="$(jq -c --arg tag "$TAG" '.[] | select(.tag_name == $tag)' <<< "$releases")"
          if [[ -n "$release" ]]; then
            jq -e '.draft == true' <<< "$release" > /dev/null
          else
            release="$(jq -n --arg tag "$TAG" --rawfile notes notes.md \
              '{tag_name: $tag, name: ("Blind Designer " + $tag), body: $notes, draft: true}' |
              curl -fsS -H "$auth" -H 'Content-Type: application/json' -d @- "$api/releases")"
          fi
          id="$(jq -er '.id' <<< "$release")"
          for file in BlindDesigner.zip BlindDesigner.zip.minisig; do
            old="$(jq -r --arg name "$file" '.assets[]? | select(.name == $name) | .id' <<< "$release")"
            if [[ -n "$old" ]]; then
              curl -fsS -o /dev/null -X DELETE -H "$auth" "$api/releases/$id/assets/$old"
            fi
            echo "Uploading $file ($(stat -c %s "$file") bytes)"
            curl -fsS -o /dev/null -w 'Upload finished in %{time_total}s\n' \
              -H "$auth" -F "attachment=@$file" "$api/releases/$id/assets?name=$file"
          done
          jq -n --rawfile notes notes.md '{body: $notes, draft: false, prerelease: false}' |
            curl -fsS -o /dev/null -X PATCH -H "$auth" -H 'Content-Type: application/json' -d @- "$api/releases/$id"
          curl -fsS "$api/releases/latest" | jq -e --arg tag "$TAG" '.tag_name == $tag'
